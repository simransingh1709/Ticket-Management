spring.application.name=tms-backend

spring.datasource.url=jdbc:h2:file:./data/tms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api/v1/openapi.json
